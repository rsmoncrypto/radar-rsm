<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panorama">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Panorama · Radar RSM</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
:root{--bg:#FCFCFB;--fg:#1A1F1D;--muted:#6F7874;--faint:#A3ABA7;--line:#ECEFED;--accent:#0F7A63;--accent-soft:#E6F3EF;--chip:#F2F4F3;--card:#FFFFFF;--warn:#9A5B12;--warn-soft:#FBF1E2;
--body:"Instrument Sans",-apple-system,"Segoe UI",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1B201E;--fg:#C9D1CD;--muted:#909B96;--faint:#66716C;--line:#2A322F;--accent:#62C2A8;--accent-soft:#1F3A33;--chip:#242B28;--card:#212825;--warn:#E9B36A;--warn-soft:#2E2414;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
.topo{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.05;margin:4px 0 6px;letter-spacing:-.01em}
.meta{font-size:13px;color:var(--muted)}
.voltar{flex:none;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 12px;margin-top:4px}
.ouvir{display:flex;align-items:center;gap:10px;margin:18px 0 6px}
.ouvir button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:999px;padding:12px 18px;background:var(--fg);color:var(--bg);display:flex;align-items:center;gap:8px;cursor:pointer}
.ouvir button.sec{background:var(--chip);color:var(--fg);font-weight:600}
.ouvir svg{width:16px;height:16px}
.minuto{background:var(--accent-soft);border-radius:18px;padding:18px 18px 16px;margin:18px 0 8px}
.minuto h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.minuto p{margin:0;font-size:17px;line-height:1.55}
.indice{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px -18px 0;padding:0 18px 4px}
.indice::-webkit-scrollbar{display:none}
.indice a{flex:none;font-size:13.5px;font-weight:600;color:var(--fg);text-decoration:none;background:var(--chip);border-radius:999px;padding:8px 13px}
.indice a span{color:var(--muted);font-weight:500;margin-left:4px}
section.tema{padding:26px 0 8px;border-top:1px solid var(--line);margin-top:22px;scroll-margin-top:12px}
.tema .rot{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.tema .rot b{color:var(--accent)}
.tema h3{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.18;margin:6px 0 10px}
.tema p.tx{margin:0 0 10px}
.diverg{background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 13px;font-size:14.5px;margin:12px 0}
.diverg b{color:var(--warn);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.fontes{font-size:12.5px;color:var(--faint);margin:8px 0 12px}
.dest{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.dt{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dt>button{all:unset;display:flex;gap:12px;padding:12px;cursor:pointer;width:100%;box-sizing:border-box}
.dt img{flex:none;width:96px;height:54px;object-fit:cover;border-radius:8px;background:var(--chip)}
.dt .tt{min-width:0;flex:1}
.dt .tt b{display:block;font-size:14.5px;line-height:1.3;font-weight:600}
.dt .tt span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.dt .tt em{display:block;font-style:normal;font-size:13px;color:var(--accent);margin-top:4px}
.dt .abre{padding:0 12px 14px}
.dt .vid{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin-bottom:10px}
.dt .vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.dt .res h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.dt .res p,.dt .res li{font-size:14.5px}
.dt .res ul{padding-left:18px;margin:4px 0}
.dt .res .ver{background:var(--accent-soft);border-radius:10px;padding:9px 12px;font-size:14px;margin-top:10px}
.dt .lk{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--accent)}
.fim{text-align:center;color:var(--muted);margin:36px 0 10px;font-size:14px}
.fim b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;color:var(--fg);margin-bottom:4px}
.vazio{padding:40px 0;color:var(--muted)}
.lendo{outline:2px solid var(--accent);outline-offset:6px;border-radius:6px}
.dias{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px -18px 0;padding:0 18px 2px}
.dias::-webkit-scrollbar{display:none}
.dias button{flex:none;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:none;color:var(--muted);border-radius:10px;padding:8px 14px;cursor:pointer}
.dias button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
html[data-tema="suave"]{--bg:#1F2422;--fg:#B3BCB7;--muted:#879290;--faint:#66716C;--chip:#272E2B;--line:#2E3532;--card:#252B29;--accent-soft:#213A33;--accent:#5DB79E;--warn:#D9A866;--warn-soft:#2E2818;color-scheme:dark}
html[data-tema="noite"]{--bg:#22201C;--fg:#D2C8B6;--muted:#9C9282;--faint:#6F675B;--chip:#2B2823;--line:#35312A;--card:#28251F;--accent-soft:#2E3326;--accent:#B9A46A;--warn:#D9A866;--warn-soft:#332A1A;color-scheme:dark}
html[data-tema="papel"]{--bg:#F3EEE3;--fg:#3B3833;--muted:#7A746A;--faint:#A69F92;--chip:#E8E2D4;--line:#E2DACA;--card:#FAF6EE;--accent-soft:#E6EBDD;--accent:#5E7A4C;--warn:#8A5A1A;--warn-soft:#F1E6CF;color-scheme:light}
html{--esc:1}
body{font-size:calc(16px * var(--esc))}
.minuto p{font-size:calc(17px * var(--esc))}
.tema h3{font-size:calc(27px * var(--esc))}
.dt .res p,.dt .res li{font-size:calc(14.5px * var(--esc))}
.ajuste{position:relative}
.ajuste>button{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:999px;padding:12px 16px;background:var(--chip);color:var(--fg);cursor:pointer;display:flex;align-items:center;gap:6px}
.painel{position:absolute;left:0;top:calc(100% + 8px);z-index:10;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:min(330px,calc(100vw - 36px));box-shadow:0 10px 30px rgba(0,0,0,.25)}
.painel h5{margin:0 0 8px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.temas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.temas button{font:inherit;font-size:12.5px;font-weight:600;border:2px solid transparent;border-radius:12px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.temas button i{display:block;width:30px;height:30px;border-radius:50%;font-style:normal;font-family:var(--serif);font-size:18px;line-height:30px;text-align:center}
.temas button[aria-pressed="true"]{border-color:var(--accent)}
.tam{display:flex;align-items:center;gap:10px}
.tam button{font:inherit;font-weight:700;border:1px solid var(--line);background:none;color:var(--fg);border-radius:10px;width:46px;height:40px;cursor:pointer}
.tam span{flex:1;text-align:center;font-size:14px;color:var(--muted)}
</style></head><body><div class="wrap">
<div class="topo"><div><div class="eyebrow">Radar RSM</div><h1>Panorama do dia</h1><div class="meta" id="meta">Carregando…</div></div><a class="voltar" href="./">← Radar</a></div>
<nav class="dias" id="dias" hidden></nav>
<div class="ouvir"><span class="ajuste"><button id="aj" aria-expanded="false"><span style="font-family:var(--serif);font-size:17px">Aa</span> Leitura</button>
<div class="painel" id="painel" hidden><h5>Cores</h5><div class="temas" id="temas">
<button data-t="auto" style="background:#F2F4F3;color:#1A1F1D"><i style="background:linear-gradient(90deg,#FCFCFB 50%,#1B201E 50%);color:#888">A</i>Automático</button>
<button data-t="suave" style="background:#1F2422;color:#B3BCB7"><i style="background:#2A302D">Aa</i>Suave</button>
<button data-t="noite" style="background:#22201C;color:#D2C8B6"><i style="background:#2E2B25">Aa</i>Noite</button>
<button data-t="papel" style="background:#F3EEE3;color:#3B3833"><i style="background:#E6DFD0">Aa</i>Papel</button></div>
<h5>Tamanho do texto</h5><div class="tam"><button id="menos">A−</button><span id="pct">100%</span><button id="mais">A+</button></div></div></span>
<span id="ouvir" style="display:contents"><button id="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg><span>Ouvir</span></button><button class="sec" id="stop" hidden>Parar</button></span></div>
<div id="corpo"></div>
</div>
<script>
const $=id=>document.getElementById(id);
/* arquivos do app chegam embaralhados ("RR1:"): base64 → XOR com fluxo SHA-256(chave||contador) → deflate */
const CHAVE_DADOS="1a4240e11be49aef14b1e1811964e2dd18d457fd47e0114e0878fff347dabfb9";
async function dec(resp){const t=await resp.text();if(!t.startsWith("RR1:"))return JSON.parse(t);
  const b=Uint8Array.from(atob(t.slice(4)),c=>c.charCodeAt(0));
  const k=new Uint8Array(CHAVE_DADOS.match(/../g).map(h=>parseInt(h,16)));
  const blk=new Uint8Array(k.length+4);blk.set(k);const dv=new DataView(blk.buffer);
  const n=Math.ceil(b.length/32),hs=[];for(let i=0;i<n;i++){dv.setUint32(k.length,i);hs.push(crypto.subtle.digest("SHA-256",blk.slice()))}
  const ks=await Promise.all(hs);const out=new Uint8Array(b.length);
  for(let i=0;i<n;i++){const h=new Uint8Array(ks[i]);for(let j=0;j<32&&i*32+j<b.length;j++)out[i*32+j]=b[i*32+j]^h[j]}
  return JSON.parse(await new Response(new Blob([out]).stream().pipeThrough(new DecompressionStream("deflate"))).text())}

/* sinais de uso do Panorama: mesma fila do Radar (radar-ev), enviada ao Mac pelo ntfy; dado bruto fica só no Mac */
const TOPICO="radar-rsm-120cf1e02de4f9d7";
const DISP=/iPhone|iPad/.test(navigator.userAgent)?"iphone":/Android/.test(navigator.userAgent)?"android":"pc";
function ev(tipo,id,x){let q=[];try{q=JSON.parse(localStorage.getItem("radar-ev")||"[]")}catch(e){}const e=[Math.floor(Date.now()/1000),tipo,id||null];if(x)e.push(x);q.push(e);try{localStorage.setItem("radar-ev",JSON.stringify(q.slice(-2000)))}catch(er){}}
let enviando=false;
async function enviaEv(){if(enviando)return;enviando=true;try{let q=[];try{q=JSON.parse(localStorage.getItem("radar-ev")||"[]")}catch(e){}
  while(q.length){let n=0,tam=40;while(n<q.length&&tam+JSON.stringify(q[n]).length<3500){tam+=JSON.stringify(q[n]).length+1;n++}n=Math.max(n,1);
    const r=await fetch("https://ntfy.sh/"+TOPICO+"-e",{method:"POST",body:JSON.stringify({d:DISP,e:q.slice(0,n)}),keepalive:true});if(!r.ok)break;
    let atual=[];try{atual=JSON.parse(localStorage.getItem("radar-ev")||"[]")}catch(e){}atual=atual.slice(n);localStorage.setItem("radar-ev",JSON.stringify(atual));q=atual}}catch(e){}finally{enviando=false}}
let iniPano=Date.now(),maxScP=0,temasLidos=new Set(),obsT=null;
addEventListener("scroll",()=>{const h=document.documentElement;maxScP=Math.max(maxScP,(scrollY+innerHeight)/h.scrollHeight)},{passive:true});
function saiPano(){ev("pano_sai",DIA,{s:Math.round((Date.now()-iniPano)/1000),sc:Math.round(maxScP*100),temas:temasLidos.size});enviaEv()}
document.addEventListener("visibilitychange",()=>{if(document.hidden)saiPano();else{iniPano=Date.now();maxScP=0;ev("pano_abriu",DIA)}});
setInterval(enviaEv,20000);
function vigiaTemas(){if(obsT)obsT.disconnect();const tm=new Map();
  obsT=new IntersectionObserver(es=>{for(const e of es){const t=e.target.dataset.tema;if(e.isIntersecting){tm.set(t,setTimeout(()=>{if(!temasLidos.has(t)){temasLidos.add(t);ev("pano_tema",DIA,{t})}},3000))}else clearTimeout(tm.get(t))}},{threshold:.4});
  document.querySelectorAll("section.tema").forEach(x=>obsT.observe(x))}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tempo=s=>{s=+s;if(!(s>0))return"";const m=Math.round(s/60);return m>=60?Math.floor(m/60)+"h"+String(m%60).padStart(2,"0"):m+" min"};
const slug=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-");
let P=null;
let DIAS=[],DIA=null;
const rotDia=d=>{const [a,m,dd]=d.split("-");const hoje=new Date();const h=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}-${String(hoje.getDate()).padStart(2,"0")}`;return `${dd}/${m}`+(d===h?" · hoje":"")};
async function iniciar(){
  try{const r=await fetch("panoramas/index.json?t="+Date.now(),{cache:"no-store"});if(r.ok)DIAS=await r.json()}catch(e){}
  const q=new URLSearchParams(location.search).get("d");
  DIA=DIAS.includes(q)?q:DIAS[0]||null;
  if(DIAS.length){$("dias").hidden=false;$("dias").innerHTML=DIAS.map(d=>`<button data-d="${d}" aria-pressed="${d===DIA}">${rotDia(d)}</button>`).join("")}
  ev("pano_abriu",DIA);carregar();
}
$("dias").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;parar();DIA=b.dataset.d;ev("pano_dia",DIA);[...$("dias").children].forEach(x=>x.setAttribute("aria-pressed",x===b));history.replaceState(null,"","?d="+DIA);carregar();scrollTo({top:0})});
async function carregar(){
  try{const r=await fetch((DIA?`panoramas/${DIA}.json`:"panorama.json")+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;P=await dec(r)}
  catch(e){$("meta").textContent="";$("corpo").innerHTML='<div class="vazio">O primeiro Panorama ainda não foi gerado. Ele fica pronto todo dia às 6h.</div>';return}
  const g=new Date(P.gerado);
  $("meta").textContent=`${g.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})} · ${g.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} · ${P.itens} itens das últimas ${P.janela_h} h`;
  $("corpo").innerHTML=`
    ${P.geral?`<div class="minuto" id="b-geral"><h2>Em 1 minuto</h2><p>${esc(P.geral)}</p></div>`:""}
    <nav class="indice">${P.temas.map(t=>`<a href="#${slug(t.tema)}">${esc(t.tema)}<span>${t.itens}</span></a>`).join("")}</nav>
    ${P.temas.map((t,ti)=>`<section class="tema" id="${slug(t.tema)}" data-tema="${esc(t.tema)}">
      <div class="rot"><b>${esc(t.tema)}</b><span>${t.itens} itens · ${t.com_resumo} com resumo</span></div>
      <h3 id="b-m${ti}">${esc(t.manchete)}</h3>
      <p class="tx" id="b-t${ti}">${esc(t.texto)}</p>
      ${t.divergencias?`<div class="diverg" id="b-d${ti}"><b>Atenção</b>${esc(t.divergencias)}</div>`:""}
      <div class="fontes">Fontes: ${t.fontes.map(esc).join(", ")}</div>
      ${t.destaques.length?`<div class="dest">${t.destaques.map((d,di)=>`<div class="dt" data-t="${ti}" data-d="${di}"><button>${d.img?`<img src="${esc(d.img)}" alt="" loading="lazy">`:""}<div class="tt"><b>${esc(d.titulo)}</b><span>${esc(d.nome)} · ${esc(d.tipo)}${tempo(d.dur)?" de "+tempo(d.dur):""}</span>${d.motivo?`<em>${esc(d.motivo)}</em>`:""}</div></button><div class="abre" hidden></div></div>`).join("")}</div>`:""}
    </section>`).join("")}
    <div class="fim"><b>Você está em dia.</b>O resto está no Radar, item por item.</div>`;
  temasLidos=new Set();vigiaTemas();
  
}
async function resumoDe(d){
  try{
    const u=d.vid?`resumos/${encodeURIComponent(d.vid)}.json`:d.nr?`noticias/${d.nr}.json`:null;if(!u)return null;
    const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});return r.ok?await dec(r):null}catch(e){return null}}
$("corpo").addEventListener("click",async e=>{
  const b=e.target.closest(".dt>button");if(!b)return;
  const box=b.parentElement,ab=box.querySelector(".abre");
  if(!ab.hidden){ab.hidden=true;ab.innerHTML="";return}
  const d=P.temas[box.dataset.t].destaques[box.dataset.d];ev("pano_dest",d.id,{t:P.temas[box.dataset.t].tema});
  ab.hidden=false;ab.innerHTML=(d.vid?`<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(d.vid)}?playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`:"")+'<div class="res"><p style="color:var(--muted)">Carregando resumo…</p></div>';
  const r=await resumoDe(d),res=ab.querySelector(".res");
  const li=a=>(a||[]).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("");
  res.innerHTML=r?`<h4>Resumo</h4><p>${esc(r.resumo)}</p>${(r.pontos||[]).length?`<h4>Pontos</h4><ul>${li(r.pontos)}</ul>`:""}${r.veredito?`<div class="ver">${esc(r.veredito)}</div>`:""}`
    :`<p style="color:var(--muted)">${d.vid?"Este vídeo ainda não tem resumo.":"Sem resumo para este item."}</p>`;
  if(!d.vid)res.insertAdjacentHTML("beforeend",`<a class="lk" href="${esc(d.url)}" target="_blank" rel="noopener">Ler a matéria completa</a>`);
});
/* ouvir: o iPhone lê em voz alta (gratuito, no aparelho) */
let fila=[],falando=false;
function blocos(){const out=[];if(P.geral)out.push(["b-geral","Em um minuto. "+P.geral]);
  P.temas.forEach((t,i)=>{out.push(["b-m"+i,t.tema+". "+t.manchete]);out.push(["b-t"+i,t.texto.replace(/\(([^)]+)\)/g,", segundo $1,")]);if(t.divergencias)out.push(["b-d"+i,"Atenção: "+t.divergencias])});return out}
function voz(){const vs=speechSynthesis.getVoices();return vs.find(v=>v.lang==="pt-BR"&&/Luciana|Felipe|Premium|Enhanced/i.test(v.name))||vs.find(v=>v.lang==="pt-BR")||vs.find(v=>/^pt/.test(v.lang))}
function proximo(){
  document.querySelectorAll(".lendo").forEach(x=>x.classList.remove("lendo"));
  if(!fila.length){parar();return}
  const [id,txt]=fila.shift(),el=$(id);if(el){el.classList.add("lendo");el.scrollIntoView({behavior:"smooth",block:"center"})}
  const u=new SpeechSynthesisUtterance(txt);u.lang="pt-BR";const v=voz();if(v)u.voice=v;u.rate=1.05;u.onend=proximo;u.onerror=proximo;speechSynthesis.speak(u)}
function parar(){fila=[];falando=false;speechSynthesis.cancel();document.querySelectorAll(".lendo").forEach(x=>x.classList.remove("lendo"));$("play").querySelector("span").textContent="Ouvir";$("stop").hidden=true}
$("play").addEventListener("click",()=>{
  if(!falando){falando=true;ev("pano_ouvir",DIA);fila=blocos();$("stop").hidden=false;$("play").querySelector("span").textContent="Pausar";proximo();return}
  if(speechSynthesis.paused){speechSynthesis.resume();$("play").querySelector("span").textContent="Pausar"}else{speechSynthesis.pause();$("play").querySelector("span").textContent="Continuar"}});
$("stop").addEventListener("click",parar);
if("speechSynthesis" in window)speechSynthesis.getVoices();
/* ajuste de leitura: guardado só neste aparelho */
const AJ={t:"auto",e:1};try{Object.assign(AJ,JSON.parse(localStorage.getItem("radar-leitura")||"{}"))}catch(e){}
function aplicaAj(){const h=document.documentElement;if(AJ.t==="auto")h.removeAttribute("data-tema");else h.dataset.tema=AJ.t;h.style.setProperty("--esc",AJ.e);
  [...$("temas").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===AJ.t));$("pct").textContent=Math.round(AJ.e*100)+"%";
  try{localStorage.setItem("radar-leitura",JSON.stringify(AJ))}catch(e){}}
$("aj").addEventListener("click",e=>{e.stopPropagation();ev("pano_leitura",DIA);const p=$("painel");p.hidden=!p.hidden;$("aj").setAttribute("aria-expanded",!p.hidden)});
$("painel").addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest("#temas button");if(b){AJ.t=b.dataset.t;aplicaAj()}});
$("menos").addEventListener("click",()=>{AJ.e=Math.max(.9,Math.round((AJ.e-.05)*100)/100);aplicaAj()});
$("mais").addEventListener("click",()=>{AJ.e=Math.min(1.4,Math.round((AJ.e+.05)*100)/100);aplicaAj()});
document.addEventListener("click",()=>{$("painel").hidden=true;$("aj").setAttribute("aria-expanded",false)});
aplicaAj();
if(!("speechSynthesis" in window)){$("play").hidden=true}
iniciar();
</script></body></html>
