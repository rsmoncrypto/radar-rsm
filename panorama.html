<div class="topo"><div><div class="eyebrow">Radar RSM</div><h1>Panorama do dia</h1><div class="meta" id="meta">Carregando…</div></div><a class="voltar" href="./">← Radar</a></div>
<nav class="dias" id="dias" hidden></nav>
<div class="ouvir"><span class="ajuste"><button id="aj" aria-expanded="false"><span style="font-family:var(--serif);font-size:17px">Aa</span> Leitura</button>
<div class="painel" id="painel" hidden><h5>Cores</h5><div class="temas" id="temas">
<button data-t="auto" style="background:#F2F4F3;color:#1A1F1D"><i style="background:linear-gradient(90deg,#FCFCFB 50%,#1B201E 50%);color:#888">A</i>Automático</button>
<button data-t="suave" style="background:#1F2422;color:#B3BCB7"><i style="background:#2A302D">Aa</i>Suave</button>

<span id="ouvir" style="display:contents"><button id="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg><span>Ouvir</span></button><button class="sec" id="stop" hidden>Parar</button></span></div>

<script>
const $=id=>document.getElementById(id);
/* arquivos do app chegam embaralhados ("RR1:"): base64 → XOR com fluxo SHA-256(chave||contador) → deflate */
const CHAVE_DADOS="1a4240e11be49aef14b1e1811964e2dd18d457fd47e0114e0878fff347dabfb9";
async function dec(resp){const t=await resp.text();if(!t.startsWith("RR1:"))return JSON.parse(t);
  const b=Uint8Array.from(atob(t.slice(4)),c=>c.charCodeAt(0));
  const k=new Uint8Array(CHAVE_DADOS.match(/../g).map(h=>parseInt(h,16)));
  const blk=new Uint8Array(k.length+4);blk.set(k);const dv=new DataView(blk.buffer);
  const n=Math.ceil(b.length/32),hs=[];for(let i=0;i<n;i++){dv.setUint32(k.length,i);hs.push(crypto.subtle.digest("SHA-256",blk.slice()))}
  const ks=await Promise.all(hs);const out=new Uint8Array(b.length);
  for(let i=0;i<n;i++){const h=new Uint8Array(ks[i]);for(let j=0;j<32&&i*32+j<b.length;j++)out[i*32+j]=b[i*32+j]^h[j]}
  return JSON.parse(await new Response(new Blob([out]).stream().pipeThrough(new DecompressionStream("deflate"))).text())}

/* sinais de uso do Panorama: mesma fila do Radar (radar-ev), enviada ao Mac pelo ntfy; dado bruto fica só no Mac */
const TOPICO="radar-rsm-120cf1e02de4f9d7";
const DISP=/iPhone|iPad/.test(navigator.userAgent)?"iphone":/Android/.test(navigator.userAgent)?"android":"pc";
function ev(tipo,id,x){try{if(localStorage.getItem("radar-teste"))return}catch(er){}let q=[];try{q=JSON.parse(localStorage.getItem("radar-ev")||"[]")}catch(e){}const e=[Math.floor(Date.now()/1000),tipo,id||null];if(x)e.push(x);q.push(e);try{localStorage.setItem("radar-ev",JSON.stringify(q.slice(-2000)))}catch(er){}}
let enviando=false;
async function enviaEv(){if(enviando)return;enviando=true;try{let q=[];try{q=JSON.parse(localStorage.getItem("radar-ev")||"[]")}catch(e){}
  while(q.length){let n=0,tam=40;while(n<q.length&&tam+JSON.stringify(q[n]).length<3500){tam+=JSON.stringify(q[n]).length+1;n++}n=Math.max(n,1);
    const r=await fetch("https://ntfy.sh/"+TOPICO+"-e",{method:"POST",body:JSON.stringify({d:DISP,e:q.slice(0,n)}),keepalive:true});if(!r.ok)break;
    let atual=[];try{atual=JSON.parse(localStorage.getItem("radar-ev")||"[]")}catch(e){}atual=atual.slice(n);localStorage.setItem("radar-ev",JSON.stringify(atual));q=atual}}catch(e){}finally{enviando=false}}
let iniPano=Date.now(),maxScP=0,temasLidos=new Set(),obsT=null;
addEventListener("scroll",()=>{const h=document.documentElement;maxScP=Math.max(maxScP,(scrollY+innerHeight)/h.scrollHeight)},{passive:true});
/* tempo: soma só tela visível, em passos de 15 s (congelamento do iPhone não conta) */
let ativoP=0,tickP=Date.now(),naSessaoP=true;
const passoP=()=>{const n=Date.now(),d=n-tickP;if(!document.hidden&&d<60000)ativoP+=d;tickP=n};setInterval(passoP,15000);
function saiPano(){if(!naSessaoP)return;passoP();naSessaoP=false;ev("pano_sai",DIA,{s:Math.round(ativoP/1000),sc:Math.round(maxScP*100),temas:temasLidos.size});ativoP=0;enviaEv()}
const voltouP=()=>{if(naSessaoP){tickP=Date.now();return}naSessaoP=true;ativoP=0;tickP=Date.now();maxScP=0;ev("pano_abriu",DIA)};

function parar(){fila=[];falando=false;speechSynthesis.cancel();document.querySelectorAll(".lendo").forEach(x=>x.classList.remove("lendo"));$("play").querySelector("span").textContent="Ouvir";$("stop").hidden=true}
$("play").addEventListener("click",()=>{
  if(!falando){falando=true;ev("pano_ouvir",DIA);fila=blocos();$("stop").hidden=false;$("play").querySelector("span").textContent="Pausar";proximo();return}
  if(speechSynthesis.paused){speechSynthesis.resume();$("play").querySelector("span").textContent="Pausar"}else{speechSynthesis.pause();$("play").querySelector("span").textContent="Continuar"}});
$("stop").addEventListener("click",parar);
if("speechSynthesis" in window)speechSynthesis.getVoices();
/* ajuste de leitura: guardado só neste aparelho */
const AJ={t:"auto",e:1};try{Object.assign(AJ,JSON.parse(localStorage.getItem("radar-leitura")||"{}"))}catch(e){}
function aplicaAj(){const h=document.documentElement;if(AJ.t==="auto")h.removeAttribute("data-tema");else h.dataset.tema=AJ.t;h.style.setProperty("--esc",AJ.e);
  [...$("temas").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===AJ.t));$("pct").textContent=Math.round(AJ.e*100)+"%";
  try{localStorage.setItem("radar-leitura",JSON.stringify(AJ))}catch(e){}}
$("aj").addEventListener("click",e=>{e.stopPropagation();ev("pano_leitura",DIA);const p=$("painel");p.hidden=!p.hidden;$("aj").setAttribute("aria-expanded",!p.hidden)});
$("painel").addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest("#temas button");if(b){AJ.t=b.dataset.t;aplicaAj()}});
$("menos").addEventListener("click",()=>{AJ.e=Math.max(.9,Math.round((AJ.e-.05)*100)/100);aplicaAj()});
$("mais").addEventListener("click",()=>{AJ.e=Math.min(1.4,Math.round((AJ.e+.05)*100)/100);aplicaAj()});
document.addEventListener("click",()=>{$("painel").hidden=true;$("aj").setAttribute("aria-expanded",false)});
aplicaAj();
if(!("speechSynthesis" in window)){$("play").hidden=true}
iniciar();
</script></body></html>
