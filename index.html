<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar RSM</title>
<meta name="theme-color" content="#FCFCFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B201E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna; cabeçalho fixo (marca, filtros); stories em fileira; lista leve; folhas (player e leitura) sobem de baixo */
:root{
  --bg:#FCFCFB; --fg:#1A1F1D; --muted:#6F7874; --faint:#A3ABA7; --line:#ECEFED; --accent:#0F7A63; --accent-soft:#E6F3EF; --chip:#F2F4F3;
  --sheet:#FFFFFF; --scrim:rgba(10,14,12,.55); --logo-fg:#FFFFFF; --logo-blip:#FFD24D; --ring:#FFD24D;
  --body:"Instrument Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1B201E; --fg:#C9D1CD; --muted:#909B96; --faint:#66716C; --line:#2A322F; --accent:#62C2A8; --accent-soft:#1F3A33; --chip:#242B28;
  --sheet:#212825; --scrim:rgba(0,0,0,.7); --logo-fg:#0D1F1A; --logo-blip:#FFE07A; --ring:#FFE07A; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body.travado{overflow:hidden}
button{font-family:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 0;border-bottom:1px solid var(--line)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:none}
.logo .sweep{transform-origin:20px 20px;animation:varre 4s linear infinite}
@keyframes varre{to{transform:rotate(-360deg)}}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
h1 span{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--accent);margin-left:6px;vertical-align:3px}
.hr{display:flex;align-items:center;gap:10px}
.st{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.st b{color:var(--accent);font-weight:600}
.ref{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center}
.ref.girando{animation:gira 1.2s linear infinite;color:var(--accent)}
@keyframes gira{to{transform:rotate(360deg)}}
.aviso{font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:0 0 10px}
.modo{display:inline-flex;background:var(--chip);border-radius:99px;padding:3px;margin-bottom:8px}
.modo button{font-weight:600;font-size:12.5px;border:0;background:none;color:var(--muted);padding:5px 11px;border-radius:99px;cursor:pointer}
.modo button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font-weight:500;font-size:13px;color:var(--muted);background:var(--chip);border:0;border-radius:99px;padding:6px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chips button span{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.chips.sub button{background:none;border:1px solid var(--line);padding:4px 10px;font-size:12.5px}
.chips.sub button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.fmt{display:flex;gap:18px;font-size:13px;padding:2px 0 0}
.fmt button{font-weight:500;font-size:13px;background:none;border:0;padding:6px 0 8px;color:var(--faint);cursor:pointer;border-bottom:2px solid transparent}
.fmt button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.stories{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:14px 16px 6px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:62px;text-decoration:none;color:var(--fg);text-align:center;font-size:11px}
.story .av{width:58px;height:58px;border-radius:50%;margin:0 auto 4px;padding:2px;background:conic-gradient(var(--ring),var(--accent),var(--ring));display:grid;place-items:center}
.story .av i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--chip);border:2px solid var(--bg);font-style:normal;font-weight:700;font-size:16px;color:var(--accent)}
.story .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.lbl{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-top:12px}
.day{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 2px}
.it{min-width:0;width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0 10px;text-decoration:none;color:inherit;align-items:start;background:none;border:0;text-align:left;font:inherit;cursor:pointer}
.li.seen .it{opacity:.45}
.it .m{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.it .m .who{color:var(--fg);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.src{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.it h3{font-size:15px;font-weight:600;margin:3px 0 0;line-height:1.3;text-wrap:pretty}
.it p{margin:4px 0 0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb{position:relative;display:block;width:116px}
.thumb img{width:116px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:var(--chip)}
.thumb b{position:absolute;right:6px;bottom:5px;font-size:10px;color:#fff;background:rgba(0,0,0,.6);border-radius:4px;padding:1px 5px;font-weight:600}
.li{position:relative;overflow:hidden;border-bottom:1px solid var(--line);touch-action:pan-y}
.li .row{display:flex;flex-direction:column;background:var(--bg);position:relative;z-index:1;transition:transform .18s ease}
.li .row.arrastando{transition:none}
.li .fundo{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;font-size:14px;color:#fff;background:var(--accent)}
.li .fundo .nao{visibility:hidden}
.li .fundo span{display:flex;align-items:center;gap:6px}.li .fundo svg{width:16px;height:16px}
.li.esq .fundo{background:#C2412D}.li.esq .fundo .sim{visibility:hidden}.li.esq .fundo .nao{visibility:visible}
.li.seen:not(.esq) .fundo{background:var(--faint)}
.rel{display:grid;gap:14px;padding-top:14px}
.rel .card{border:1px solid var(--line);border-radius:14px;padding:14px}
.rel h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.rel .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rel .kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.rel .kpi span{font-size:12px;color:var(--muted)}
.rel .seg2{display:inline-flex;background:var(--chip);border-radius:99px;padding:3px;margin-bottom:10px}
.rel .seg2 button{font-weight:600;font-size:12.5px;border:0;background:none;color:var(--muted);padding:5px 12px;border-radius:99px}
.rel .seg2 button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}
.rel .horas{display:flex;align-items:flex-end;gap:2px;height:70px}
.rel .horas i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.rel .eixo{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:4px}
.rel table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rel td,.rel th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.rel td:first-child,.rel th:first-child{text-align:left}
.rel th{font-size:11px;color:var(--faint);font-weight:600}
.rel .cl{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap}
.cl.vale{background:var(--accent-soft);color:var(--accent)}.cl.manchete{background:var(--chip);color:var(--muted)}
.cl.excesso{background:#FBE3DE;color:#B23A26}.cl.ignorado{background:#FFF1D0;color:#8A5A00}.cl.ocasional{background:var(--chip);color:var(--fg)}.cl.coletando{color:var(--faint)}
@media (prefers-color-scheme:dark){.cl.excesso{background:#3E1E18;color:#F29A88}.cl.ignorado{background:#3A2E10;color:#FFD27A}}
.rel .sug{display:grid;gap:8px}
.rel .sug div{font-size:14px;line-height:1.45;padding:10px 12px;border-radius:10px;background:var(--chip)}
.rel .vazio{font-size:14px;color:var(--muted);line-height:1.5}
.rel .tab-wrap{overflow-x:auto}
.ref.rel-btn svg{width:18px;height:18px}
.ref.rel-btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.acts{display:flex;align-items:center;gap:18px;padding:2px 0 12px}
.acts .esp{flex:1}
.voto{width:46px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.voto svg{width:17px;height:17px}
.voto.bom{color:#1E8A5A;background:#DDF5E8;border-color:transparent}
.voto.ruim{color:#C2412D;background:#FCE4E0;border-color:transparent}
@media (prefers-color-scheme:dark){.voto.bom{color:#6EDBA3;background:#173528}.voto.ruim{background:#3D1E19}}
.voto.bom[aria-pressed="true"]{background:#1E8A5A;color:#fff;border-color:transparent}
.voto.ruim[aria-pressed="true"]{background:#C2412D;color:#fff;border-color:transparent}
@media (prefers-color-scheme:dark){.voto.ruim{color:#F08A76}}
.li.seen .acts{opacity:1}
.li.seen .it{opacity:.45}
.sav{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--faint);cursor:pointer;display:grid;place-items:center;padding:0}
.sav svg{width:16px;height:16px}
.sav.depois[aria-pressed="true"]{background:#FFF4D1;border-color:transparent;color:#9A6B00}
.sav.estudar[aria-pressed="true"]{background:#E4ECFF;border-color:transparent;color:#2F55C9}
@media (prefers-color-scheme:dark){.sav.depois[aria-pressed="true"]{background:#3A3010;color:#FFD24D}.sav.estudar[aria-pressed="true"]{background:#1B2648;color:#9DB5FF}}
.linha-modo{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.linha-modo .modo{margin-bottom:0}
.listas{display:flex;gap:6px;margin-left:auto}
.listas button{font-weight:600;font-size:12px;border:1px solid var(--line);background:none;color:var(--muted);padding:6px 9px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.listas button svg{width:13px;height:13px}
@media (max-width:400px){.listas button svg{display:none}.listas button{padding:6px 8px}.modo button{padding:5px 9px}}
.listas button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dica{font-size:12px;color:var(--faint);margin:10px 0 0}
.res{margin:12px 0 4px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.res h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.res h4:first-child{margin-top:0}
.res p{margin:0;font-size:15px;line-height:1.55}
.res ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px;line-height:1.5}
.res .ver{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px}
.res .mom{display:grid;gap:6px}
.res .mom button{display:flex;gap:10px;text-align:left;font:inherit;font-size:14px;background:none;border:0;padding:4px 0;color:var(--fg);cursor:pointer}
.res .mom b{flex:none;font-variant-numeric:tabular-nums;color:var(--accent);min-width:44px}
.res .rodape{margin-top:12px;font-size:11.5px;color:var(--faint)}
.btn-res{width:100%;margin:12px 0 4px;font-weight:700;font-size:15px;border:0;border-radius:12px;padding:13px;background:var(--accent);color:#fff;cursor:pointer}
.btn-res[disabled]{opacity:.75}
.dica-gesto{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;padding:8px 2px 2px;color:var(--muted)}
.dica-gesto span{display:flex;align-items:center;gap:5px}
.dica-gesto svg{width:15px;height:15px}
.dica-gesto b{font-size:14px}
.dica-gesto .bom{color:var(--accent)}
.dica-gesto .ruim{color:#C2412D}
@media (prefers-color-scheme:dark){.dica-gesto .ruim{color:#F08A76}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast span{flex:1;min-width:0}
.toast button{flex:none;font-weight:700;font-size:13.5px;border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:#fff;cursor:pointer}
.toast .fx{background:none;color:var(--bg);opacity:.7;padding:8px 6px}
.acoes .lista{display:flex;align-items:center;gap:6px}
.acoes .lista svg{width:15px;height:15px}
.acoes .lista[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tag-res.and{color:var(--muted);background:var(--chip)}
.tag-res{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px}
.vel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.vel button{font-weight:600;font-size:13px;border:1px solid var(--line);background:none;color:var(--fg);border-radius:99px;padding:7px 12px;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vel button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.vel .segura{margin-left:auto;background:var(--accent-soft);color:var(--accent);border-color:transparent}
.vel .segura.on{background:var(--accent);color:#fff}
.salvo-em{font-size:11.5px;color:var(--faint)}
.end{margin:28px 0 0;text-align:center;color:var(--muted);font-size:14px;display:grid;gap:10px;justify-items:center}
.end strong{color:var(--accent);font-size:18px}
.end button{font-weight:600;font-size:13px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:99px;padding:9px 16px;cursor:pointer}
.end .undo{background:none;color:var(--muted);text-decoration:underline;padding:4px}
.note{font-size:12px;color:var(--faint);margin-top:24px}
.msg{padding:28px 0;color:var(--muted);font-size:14px}
.msg strong{display:block;color:var(--fg);margin-bottom:4px;font-size:15px}
.msg button{margin-top:12px;font-weight:600;font-size:13px;background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:8px 14px}
/* folha (player / leitura) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:18px 18px 0 0;max-height:calc(100% - env(safe-area-inset-top) - 24px);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.on{transform:none}
.sheet .bar{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.sheet .grab{position:absolute;top:6px;left:50%;width:38px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet .who{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .who b{color:var(--fg)}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--chip);color:var(--fg);font-size:18px;cursor:pointer}
.sheet .corpo{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 max(16px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.video.vertical{aspect-ratio:9/16;max-height:62vh;width:auto;margin:0 auto}
.video iframe,.video>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.sheet h2{font-size:18px;line-height:1.3;margin:14px 0 6px;text-wrap:balance}
.sheet .txt{font-size:15.5px;line-height:1.6;color:var(--fg);max-width:65ch}
.sheet .txt p{margin:0 0 12px}
.sheet .desc{font-size:14px;color:var(--muted);white-space:pre-line}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.acoes a,.acoes button{font-weight:600;font-size:13.5px;text-decoration:none;border-radius:10px;padding:10px 14px;border:0;cursor:pointer}
.acoes .pri{background:var(--fg);color:var(--bg)}
.acoes .sec{background:var(--chip);color:var(--fg)}
.bloq{padding:30px 16px;text-align:center;color:#fff;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.logo .sweep,.ref.girando{animation:none}.sheet,.scrim{transition:none}}
.btn-res .pts{display:inline-block;width:1.1em;text-align:left}
.votos{display:flex;gap:10px;margin:10px 0 4px}
.votos .vt{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:14px;border-radius:12px;padding:12px;border:0;cursor:pointer}
.votos .vt svg{width:17px;height:17px}
.votos .vt.ruim{color:#C2412D;background:#FCE4E0}
.votos .vt.bom{color:#1E8A5A;background:#DDF5E8}
.votos .vt.ruim[aria-pressed="true"]{background:#C2412D;color:#fff}
.votos .vt.bom[aria-pressed="true"]{background:#1E8A5A;color:#fff}
@media (prefers-color-scheme:dark){.votos .vt.ruim{color:#F08A76;background:#3D1E19}.votos .vt.bom{color:#6EDBA3;background:#173528}}
.who .mais{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 5px;margin-left:2px}
.outras{font-size:13px;color:var(--muted);margin:-4px 0 10px}.outras a{color:var(--accent);font-weight:600}
.tit-txt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px}
.story.pano .av{background:var(--accent);border-color:var(--accent)}
.story.pano .av i{background:var(--accent);color:#fff;display:grid;place-items:center}
.story.pano .av svg{width:26px;height:26px}
.story.pano .nm{color:var(--accent);font-weight:700}
@media (prefers-color-scheme:dark){.story.pano .av i{color:#0D1F1A}}
.sub-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.lin{margin:2px 0;font-size:14px}
.mut,.lin.mut{color:var(--muted);font-size:13px}
.dias-bar{display:flex;align-items:flex-end;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:4px}
.dias-bar::-webkit-scrollbar{display:none}

const TOPICO = "radar-rsm-120cf1e02de4f9d7";

/* vistos: sincronizados entre aparelhos.
   Base = vistos.json (o Mac junta as marcações e publica); por cima, as marcações recentes do tópico privado no ntfy;
   por cima, o que este aparelho ainda não conseguiu enviar. */
const TOP_V=TOPICO+"-v";
/* sinais de uso: guardados no Mac para o relatório */
let evq=[];try{evq=JSON.parse(localStorage.getItem("radar-ev")||"[]")}catch(e){}
/* arquivos do app chegam embaralhados ("RR1:"): base64 → XOR com fluxo SHA-256(chave||contador) → deflate */
const CHAVE_DADOS="1a4240e11be49aef14b1e1811964e2dd18d457fd47e0114e0878fff347dabfb9";
async function dec(resp){const t=await resp.text();if(!t.startsWith("RR1:"))return JSON.parse(t);
  const b=Uint8Array.from(atob(t.slice(4)),c=>c.charCodeAt(0));
  const k=new Uint8Array(CHAVE_DADOS.match(/../g).map(h=>parseInt(h,16)));
  const blk=new Uint8Array(k.length+4);blk.set(k);const dv=new DataView(blk.buffer);
  const n=Math.ceil(b.length/32),hs=[];for(let i=0;i<n;i++){dv.setUint32(k.length,i);hs.push(crypto.subtle.digest("SHA-256",blk.slice()))}
  const ks=await Promise.all(hs);const out=new Uint8Array(b.length);
  for(let i=0;i<n;i++){const h=new Uint8Array(ks[i]);for(let j=0;j<32&&i*32+j<b.length;j++)out[i*32+j]=b[i*32+j]^h[j]}
  return JSON.parse(await new Response(new Blob([out]).stream().pipeThrough(new DecompressionStream("deflate"))).text())}
const DISP=/iPhone|iPad/.test(navigator.userAgent)?"iphone":/Android/.test(navigator.userAgent)?"android":"pc";
function ev(tipo,id,x){const e=[Math.floor(Date.now()/1000),tipo,id||null];if(x)e.push(x);evq.push(e);if(evq.length>2000)evq=evq.slice(-2000);try{localStorage.setItem("radar-ev",JSON.stringify(evq))}catch(er){}}
let enviandoEv=false;
async function enviaEv(){
  if(enviandoEv||!evq.length)return;enviandoEv=true;
  try{
    while(evq.length){
      let n=0,tam=40;while(n<evq.length&&tam+JSON.stringify(evq[n]).length<3500){tam+=JSON.stringify(evq[n]).length+1;n++}
      n=Math.max(n,1);
      const r=await fetch("https://ntfy.sh/"+TOPICO+"-e",{method:"POST",body:JSON.stringify({d:DISP,e:evq.slice(0,n)})});
      if(!r.ok)break;evq=evq.slice(n);try{localStorage.setItem("radar-ev",JSON.stringify(evq))}catch(er){}
    }
  }catch(e){}finally{enviandoEv=false}
}
setInterval(enviaEv,30000);
let seen=new Set(), pend=[], salvos=new Map();
const ICON={depois:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  estudar:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 11v5c3 2 9 2 12 0v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'};
const NOME_L={depois:"Ver depois",estudar:"Estudar"};
const ICON_UP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v11H3V10zM7 10l4-8c1.7 0 3 1.3 3 3v4h5.5a2 2 0 0 1 2 2.3l-1.3 8A2 2 0 0 1 18.2 21H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
const ICON_DOWN='<svg viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(180deg)"><path d="M7 10v11H3V10zM7 10l4-8c1.7 0 3 1.3 3 3v4h5.5a2 2 0 0 1 2 2.3l-1.3 8A2 2 0 0 1 18.2 21H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
const chaveL=(l,id)=>l+"|"+id;
function poeSalvo(o){o.lista=o.lista||"depois";salvos.set(chaveL(o.lista,o.id),o)}
function tiraSalvo(k){salvos.delete(k.includes("|")?k:chaveL("depois",k))}
const tem=(l,id)=>salvos.has(chaveL(l,id));
try{JSON.parse(localStorage.getItem("radar-salvos")||"[]").forEach(poeSalvo)}catch(e){}
try{const v=JSON.parse(localStorage.getItem("radar-vistos")||"[]");seen=new Set(Array.isArray(v)?v:(v.ids||[]))}catch(e){}
try{pend=JSON.parse(localStorage.getItem("radar-pend")||"[]")}catch(e){}
/* primeira vez com sincronização: envia o que este aparelho já tinha marcado */
try{if(!localStorage.getItem("radar-migr")&&seen.size){const t=[...seen];for(let k=0;k<t.length;k+=120)pend.push({a:t.slice(k,k+120),d:[]});localStorage.setItem("radar-pend",JSON.stringify(pend))}localStorage.setItem("radar-migr","1")}catch(e){}
function cache(){try{localStorage.setItem("radar-vistos",JSON.stringify({ids:[...seen].slice(-4000)}));localStorage.setItem("radar-salvos",JSON.stringify([...salvos.values()]));localStorage.setItem("radar-pend",JSON.stringify(pend))}catch(e){}}
function aplica(ev){(ev.a||[]).forEach(i=>seen.add(i));(ev.d||[]).forEach(i=>seen.delete(i));(ev.s||[]).forEach(poeSalvo);(ev.u||[]).forEach(tiraSalvo)}
function compacto(i){const o={};for(const k of ["id","titulo","nome","tema","tipo","url","img","vid","dur","quando","grupo","formato","perfil"])if(i[k]!==undefined&&i[k]!=="")o[k]=i[k];if(i.texto)o.texto=String(i.texto).slice(0,280);o.salvoEm=new Date().toISOString();return o}
function salvar(l,i){ev(l,i.id);const o=compacto(i);o.lista=l;poeSalvo(o);pend.push({s:[o]});if(l==="estudar"&&!seen.has(i.id)){seen.add(i.id);pend.push({a:[i.id],d:[]})}cache();envia();render()}
function dessalvar(l,id){ev("tirou_"+l,id);const k=chaveL(l,id);salvos.delete(k);pend.push({u:[k]});cache();envia();render()}
let enviando=false;
async function envia(){
  if(enviando||!pend.length)return;enviando=true;
  try{
    while(pend.length){
      const ev=pend[0];
      const r=await fetch("https://ntfy.sh/"+TOP_V,{method:"POST",body:JSON.stringify(ev)});
      if(!r.ok)break;
      pend.shift();cache();
    }
  }catch(e){}finally{enviando=false}
}
function registra(a,d){
  for(let k=0;k<Math.max(a.length,d.length);k+=120)pend.push({a:a.slice(k,k+120),d:d.slice(k,k+120)});
  cache();envia();
}
function marca(ids){ids=ids.filter(i=>!seen.has(i));ids.forEach(i=>seen.add(i));registra(ids,[]);render()}
function desmarca(ids){ids=ids.filter(i=>seen.has(i));ids.forEach(i=>seen.delete(i));registra([],ids);render()}
async function sincroniza(){
  try{
    const r=await fetch("vistos.json?t="+Date.now(),{cache:"no-store"});
    const v=r.ok?await dec(r):{ids:[],ultimo:""};

    const txt=await q.text();

    pend.forEach(aplica);
    cache(); render(); envia();
  }catch(e){}
}

function tempo(s){if(s===-1)return "AO VIVO";if(!s)return "";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=String(s%60).padStart(2,"0");return h?`${h}:${String(m).padStart(2,"0")}:${ss}`:`${m}:${ss}`}

function dia(iso){const d=new Date(iso),h=new Date();h.setHours(0,0,0,0);const n=Math.round((h-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return n<=0?"Hoje":n===1?"Ontem":d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"short"})}

const NOME_CL={vale:"Vale a pena",ocasional:"Ocasional",manchete:"Só manchete",excesso:"Excesso",ignorado:"Não aparece",coletando:"Coletando"};
/* comportamento: onde para sem abrir, como navega, o que faz dentro do item e no Panorama (desde 30/10) */
/* tempo no Radar: barras por dia (com minutos) e, para o dia escolhido, minutos por hora */
let relDia=null;
function relTempoTopo(td){
  const ds=(td||[]).filter(x=>x.min>0);if(!ds.length)return "";
  if(!relDia||(relDia!=="7d"&&!ds.some(x=>x.data===relDia)))relDia=ds[ds.length-1].data;

  const tot=sel?sel:{min:ds.reduce((a,x)=>a+x.min,0),sessoes:ds.reduce((a,x)=>a+x.sessoes,0),abertos:ds.reduce((a,x)=>a+x.abertos,0)};
  const hmax=Math.max(...horas);
  const fm=m=>m>=60?`${Math.floor(m/60)}h${String(Math.round(m%60)).padStart(2,"0")}`:`${Math.round(m)} min`;
  const _h=new Date(),hoje=`${_h.getFullYear()}-${String(_h.getMonth()+1).padStart(2,"0")}-${String(_h.getDate()).padStart(2,"0")}`;

   <p class="lin" style="margin-top:12px"><b>${fm(tot.min)}</b> no app · ${tot.sessoes} ${tot.sessoes===1?"abertura":"aberturas"} · ${tot.abertos} itens abertos${relDia==="7d"&&ds.length?` · média ${fm(tot.min/ds.length)} por dia`:""}</p>

  const p=c.parou||{},d=c.dentro||{},pa=c.panorama||{},nav=c.navegacao||{};
  const lst=a=>(a||[]).map(([n,v])=>`${esc(NOMEV[n]||n)} <b>${v}</b>`).join(" · ");

    else{clearTimeout(timers.get(el));timers.delete(el);const t0=visIni.get(el);visIni.delete(el);
      if(t0&&!document.hidden){const sec=(Date.now()-t0)/1000;if(sec>=2.5&&abertoId!==id)ev("parou",id,{s:Math.min(60,Math.round(sec))})}}}},{threshold:.6});
  obs.disconnect();timers.forEach(t=>clearTimeout(t));timers=new Map();document.querySelectorAll("#feed .li").forEach(el=>obs.observe(el));
}

/* Estudar: dossiê da IA (radar_estudar.py) — estudar/index.json = {id do item: chave} */

async function carregaEstudo(){try{const r=await fetch("estudar/index.json?t="+Date.now(),{cache:"no-store"});if(r.ok){const n=await r.json();const mudou=JSON.stringify(n)!==JSON.stringify(ESTUDO);ESTUDO=n;if(mudou&&modo==="estudar")render()}}catch(e){}}
async function leEstudo(k){const r=await fetch(`estudar/${k}.json?t=${Date.now()}`,{cache:"no-store"});return r.ok?await dec(r):null}
function htmlEstudo(d){
  const F=d.fontes||[];const fonte=n=>{const f=F.find(x=>x.n===n);return f?`<a href="${esc(f.url)}" target="_blank" rel="noopener" class="fn">${n}</a>`:""};

   ${(d.insights||[]).length?`<h4>Insights</h4><ul>${d.insights.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
   ${(d.aplicar||[]).length?`<h4>Como aplicar</h4><ul class="est-ap">${d.aplicar.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
   ${(d.leituras||[]).length?`<h4>Para ler</h4><ul>${d.leituras.map(l=>{const f=F.find(x=>x.n===l.fonte);return f?`<li><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titulo)}</a> — ${esc(l.por_que||"")}</li>`:""}).join("")}</ul>`:""}
   ${(d.conversa||[]).length?`<h4>Suas perguntas</h4>${d.conversa.map(c=>`<div class="est-q"><b>${esc(c.p)}</b><div>${cita(c.r).replace(/\n/g,"<br>")}</div></div>`).join("")}`:""}

   <div class="est-esp" id="est-esp" hidden>Pensando<span class="pts"></span></div>
   ${F.length?`<details class="est-fontes"><summary>${F.length} fontes</summary>${F.map(f=>`<div><span class="fn">${f.n}</span> <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titulo)}</a></div>`).join("")}</details>`:""}
   <p class="rodape">Feito por IA (${esc(d.modelo||"Gemini")}) com busca na web. Pode conter erros: confira nas fontes.</p></div>`}

  const el=$("estudo");if(!el)return;const k=ESTUDO[i.id];
  if(!k){el.innerHTML=`<div class="est"><div class="est-h">Aprofundamento da IA</div><p class="mut">A IA está pesquisando e montando o aprofundamento deste item. Leva alguns minutos; volte daqui a pouco.</p></div>`;return}
  try{const d=await leEstudo(k);if(d&&abertoId===i.id){el.innerHTML=htmlEstudo(d);el.dataset.k=k;el.dataset.n=(d.conversa||[]).length}}catch(e){}
}
async function perguntaEstudo(p){
  const el=$("estudo");if(!el||!el.dataset.k||!p.trim())return;const k=el.dataset.k,n0=+el.dataset.n||0,id=abertoId;
  ev("estudar_pergunta",id);$("est-esp").hidden=false;$("est-in").value="";
  try{await fetch("https://ntfy.sh/"+TOPICO+"-q",{method:"POST",body:JSON.stringify({k,p:p.slice(0,500)})})}catch(e){}
  for(let t=0;t<40;t++){await new Promise(r=>setTimeout(r,6000));if(abertoId!==id)return;
    try{const d=await leEstudo(k);if(d&&(d.conversa||[]).length>n0){el.innerHTML=htmlEstudo(d);el.dataset.k=k;el.dataset.n=d.conversa.length;el.querySelector(".est-q:last-of-type")?.scrollIntoView({behavior:"smooth",block:"center"});return}}catch(e){}}
  const esp=$("est-esp");if(esp)esp.textContent="O Mac não respondeu ainda. Tente de novo em alguns minutos.";
}
async function carregaIndice(){try{const r=await fetch("resumos/index.json?t="+Date.now(),{cache:"no-store"});if(r.ok){const n=new Set(await r.json());const mudou=n.size!==RESUMOS.size||[...n].some(v=>!RESUMOS.has(v));RESUMOS=n;if(mudou)render()}}catch(e){}}
function seg(t){const p=String(t).split(":").map(Number);return p.reduce((a,b)=>a*60+b,0)}
function htmlResumo(d){
  const li=a=>(a||[]).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("");
  return `<div class="res">
    <h4>Resumo</h4><p>${esc(d.resumo)}</p>
    ${(d.pontos||[]).length?`<h4>Pontos principais</h4><ul>${li(d.pontos)}</ul>`:""}
    ${(d.dados||[]).length?`<h4>${d.texto!==undefined?"Citados":"Citados no vídeo"}</h4><ul>${li(d.dados)}</ul>`:""}
    ${(d.momentos||[]).length?`<h4>Momentos</h4><div class="mom">${d.momentos.map(m=>`<button data-t="${esc(m.t)}"><b>${esc(m.t)}</b><span>${esc(m.s)}</span></button>`).join("")}</div>`:""}
    ${d.veredito?`<div class="ver">${esc(d.veredito)}</div>`:""}

}
/* notícias: resumo, texto completo e "também noticiado por" vêm de noticias/<chave>.json (radar_noticias.py no Mac) */
async function chaveNoticia(id){const h=await crypto.subtle.digest("SHA-1",new TextEncoder().encode(id));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,16)}
async function mostraNoticia(i){
  try{
    const k=i.nr||await chaveNoticia(i.id);
    const r=await fetch(`noticias/${k}.json?t=${Date.now()}`,{cache:"no-store"});if(!r.ok||abertoId!==i.id)return;
    const d=await dec(r);if(abertoId!==i.id)return;
    const nres=$("nres"),ntxt=$("ntxt");if(!nres||!ntxt)return;
    nres.innerHTML=htmlResumo(d);
    const atual=ntxt.textContent.length;
    if(d.texto&&d.texto.length>atual+200)ntxt.innerHTML=d.texto.split(/\n{2,}/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("");
    ntxt.insertAdjacentHTML("beforebegin",`<h4 class="tit-txt">Texto completo${d.traduzido?' · traduzido do inglês por IA':''}</h4>`);
    const ac=document.querySelector("#sh-corpo .acoes"),vo=document.querySelector("#sh-corpo .votos");
    if(ac&&vo){nres.after(ac);ac.after(vo)}
  }catch(e){}
}
const itemAberto=()=>DATA.itens.find(x=>x.id===abertoId)||[...salvos.values()].find(o=>o.id===abertoId);
/* fila de resumos: continua rodando com o vídeo fechado; avisa quando fica pronto */
let fila=new Map();
try{fila=new Map(JSON.parse(localStorage.getItem("radar-fila")||"[]"))}catch(e){}
const guardaFila=()=>{try{localStorage.setItem("radar-fila",JSON.stringify([...fila]))}catch(e){}};
async function mostraResumo(i){
  const el=$("resumo");if(!el)return;
  /* sempre confere no servidor: o pré-resumo pode ter ficado pronto depois da última lista */
  if(RESUMOS.has(i.vid))el.innerHTML=`<div class="res"><p>Carregando o resumo…</p></div>`;
  try{const r=await fetch(`resumos/${encodeURIComponent(i.vid)}.json?t=${Date.now()}`,{cache:"no-store"});if(r.ok){RESUMOS.add(i.vid);const dd=await dec(r);if(abertoId===i.id)el.innerHTML=htmlResumo(dd);return}}catch(e){}
  if(abertoId!==i.id)return;
  el.innerHTML=fila.has(i.vid)?`<button class="btn-res" id="btn-res" disabled>Gerando o resumo<span class="pts"></span></button>`:`<button class="btn-res" id="btn-res">Resumir este vídeo</button>`;
}
async function pedeResumo(i){ev("resumo",i.id);
  const b=$("btn-res");
  try{await fetch("https://ntfy.sh/"+TOPICO+"-r",{method:"POST",body:JSON.stringify({vid:i.vid})})}
  catch(e){if(b){b.textContent="Sem internet. Tocar para tentar de novo"}return}
  fila.set(i.vid,{id:i.id,titulo:i.titulo,ini:Math.floor(Date.now()/1000)-5});guardaFila();
  if(b){b.disabled=true;b.innerHTML='Gerando o resumo<span class="pts"></span>'}
  render();vigiaFila();
}
function toast(html,acao){const t=$("toast");t.innerHTML=html;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>{t.hidden=true},12000);t.onclick=e=>{if(e.target.closest(".fx")){t.hidden=true;return}const b=e.target.closest("button");if(b&&acao){t.hidden=true;acao()}}}
function resumoPronto(vid,d){
  const f=fila.get(vid);fila.delete(vid);guardaFila();RESUMOS.add(vid);render();
  const i=f&&(DATA.itens.find(x=>x.id===f.id)||[...salvos.values()].find(o=>o.id===f.id));
  if(abertoId&&i&&abertoId===i.id){const el=$("resumo");if(el){if(d)el.innerHTML=htmlResumo(d);else mostraResumo(i)}return}
  toast(`<span>Resumo pronto: <b>${esc((f&&f.titulo)||"vídeo")}</b></span><button>Abrir</button><button class="fx" aria-label="Fechar">×</button>`,()=>{if(i)abrir(i)});
}
let vigiando=false;
async function vigiaFila(){
  if(vigiando||!fila.size)return;vigiando=true;
  try{
    while(fila.size){
      const ini=Math.min(...[...fila.values()].map(f=>f.ini));
      try{
        const q=await fetch(`https://ntfy.sh/${TOPICO}-rr/json?poll=1&since=${ini}`,{cache:"no-store"});
        const msgs=(await q.text()).split("\n").filter(Boolean).map(l=>{try{const m=JSON.parse(l);return m.event==="message"?JSON.parse(m.message):null}catch(e){return null}}).filter(Boolean);
        for(const [vid,f] of [...fila]){
          const m=msgs.filter(x=>x.vid===vid).pop();
          if(m&&m.erro){fila.delete(vid);guardaFila();render();toast(`<span>Não deu para resumir <b>${esc(f.titulo)}</b>: ${esc(m.erro.slice(0,100))}</span><button class="fx">×</button>`);continue}
          if(m&&m.r){resumoPronto(vid,m.r);continue}
          if(m&&m.pronto){resumoPronto(vid,null);continue}
          if(Date.now()/1000-f.ini>8*60){const r=await fetch(`resumos/${encodeURIComponent(vid)}.json?t=${Date.now()}`,{cache:"no-store"}).catch(()=>null);
            if(r&&r.ok)resumoPronto(vid,await dec(r));
            else if(Date.now()/1000-f.ini>15*60){fila.delete(vid);guardaFila();render();toast(`<span>O Mac não respondeu ao resumo de <b>${esc(f.titulo)}</b>. Tente de novo.</span><button class="fx">×</button>`)}}
        }
      }catch(e){}
      if(fila.size)await new Promise(r=>setTimeout(r,6000));
      if(document.hidden)break;
    }
  }finally{vigiando=false}
}

  const vt=e.target.closest(".votos .vt");

    if(vt.dataset.v==="sim"){if(simSet.has(id)&&!naoSet.has(id)){simSet.delete(id);ev("desfez",id)}else{simSet.add(id);if(naoSet.delete(id))guardaNao();ev("bom",id)}guardaSim()}
    else{if(naoSet.has(id)){naoSet.delete(id);ev("desfez",id)}else{naoSet.add(id);if(simSet.delete(id))guardaSim();ev("esq",id)}guardaNao()}
    document.querySelectorAll(".votos .vt").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v==="sim"?simSet.has(id)&&!naoSet.has(id):naoSet.has(id)));return}
  if(e.target.closest("#btn-res")){const i=itemAberto();if(i)pedeResumo(i);return}
  const m=e.target.closest(".mom button");if(m)ev("momento",abertoId,{t:m.dataset.t});if(m&&player&&player.seekTo){try{player.seekTo(seg(m.dataset.t),true);player.playVideo();document.querySelector(".video").scrollIntoView({behavior:"smooth"})}catch(x){}}
});

let abertoEm=0,assistiu=0,tocandoDesde=0,durAberto=0;
let visIni=new Map(), maxSc=0;
function registraFecho(){
  if(!abertoId)return;if(tocandoDesde){assistiu+=(Date.now()-tocandoDesde)/1000*(player&&player.getPlaybackRate?player.getPlaybackRate()||1:1);tocandoDesde=0}
  const temRes=!!document.querySelector("#sh-corpo .res h4");
  ev("fechou",abertoId,{ms:Date.now()-abertoEm,ws:Math.round(assistiu),dur:durAberto||0,sc:Math.round(maxSc*100),r:temRes?1:0});abertoEm=Date.now();assistiu=0;maxSc=0;
}
function abrir(i){
  abertoId=i.id;abertoEm=Date.now();assistiu=0;tocandoDesde=0;maxSc=0;durAberto=i.dur>0?i.dur:0;ev("abriu",i.id,{m:modo});
  $("sh-who").innerHTML=`<b>${esc(i.nome)}</b> · ${esc(i.tipo)}${i.dur>0?" · "+tempo(i.dur):""} · ${quando(i.quando)}`;
  let c="";
  if(i.vid){
    c=`<div class="video${i.tipo==="Short"?" vertical":""}"><div id="yt"></div></div>
      <h2>${esc(i.titulo)}</h2>
      <div id="resumo"></div>
      <div class="vel" id="vel">${[1,1.5,2].map(v=>`<button data-v="${v}" aria-pressed="${v===velEscolhida}">${String(v).replace(".",",")}x</button>`).join("")}<button class="segura" id="segura">Segure: 2x</button></div>
      <div class="acoes"><button class="sec lista" data-l="depois" aria-pressed="${tem("depois",i.id)}">${ICON.depois}Ver depois</button><button class="sec lista" data-l="estudar" aria-pressed="${tem("estudar",i.id)}">${ICON.estudar}Estudar</button><a class="sec" href="${esc(i.url)}" target="_blank" rel="noopener">Abrir no YouTube</a></div>
      ${votosHTML(i)}
      ${i.texto?`<div class="desc">${esc(i.texto)}</div>`:""}`;
  }else{
    const corpo=(i.completo||i.texto||"").split(/\n{2,}/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("");
    const orig=i.titulo_original?`<div class="outras">Original: ${esc(i.titulo_original)}</div>`:"";
    const outras=i.outras?`<div class="outras">Também noticiado por ${i.outras.map(o=>`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.nome)}</a>`).join(", ")}</div>`:"";
    c=`<h2>${esc(i.titulo)}</h2>${orig}${outras}<div id="nres"></div><div class="txt" id="ntxt">${corpo||"<p>Sem texto no resumo.</p>"}</div>
      <div class="acoes"><a class="pri" href="${esc(i.url)}" target="_blank" rel="noopener">${ehNoticia(i)?"Ler a matéria completa":"Abrir o original"}</a><button class="sec lista" data-l="depois" aria-pressed="${tem("depois",i.id)}">${ICON.depois}Ver depois</button><button class="sec lista" data-l="estudar" aria-pressed="${tem("estudar",i.id)}">${ICON.estudar}Estudar</button></div>
      ${votosHTML(i)}`;
  }
  if(tem("estudar",i.id))c=`<div id="estudo"></div>`+c;
  $("sh-corpo").innerHTML=c; $("sh-corpo").scrollTop=0;
  if(tem("estudar",i.id))mostraEstudo(i);
  $("scrim").hidden=false;$("sheet").hidden=false;document.body.classList.add("travado");
  requestAnimationFrame(()=>{$("scrim").classList.add("on");$("sheet").classList.add("on")});
  if(i.vid){tocar(i,!RESUMOS.has(i.vid));mostraResumo(i)}else mostraNoticia(i);
  fica.add(i.id);
  if(!seen.has(i.id)){seen.add(i.id);registra([i.id],[])}
}
function fechar(){
  registraFecho();enviaEv();
  if(player){try{player.destroy()}catch(e){}player=null}
  $("scrim").classList.remove("on");$("sheet").classList.remove("on");document.body.classList.remove("travado");
  setTimeout(()=>{$("scrim").hidden=true;$("sheet").hidden=true;$("sh-corpo").innerHTML=""},250);
  abertoId=null; render();
}
let ytPronto=null;
function carregaYT(){
  if(ytPronto)return ytPronto;
  ytPronto=new Promise(res=>{window.onYouTubeIframeAPIReady=res;const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=()=>res();document.head.appendChild(s)});
  return ytPronto;
}
async function tocar(i,auto=true){
  await carregaYT();
  if(abertoId!==i.id||!$("yt"))return;
  if(!window.YT||!YT.Player){$("yt").outerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(i.vid)}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;return}
  player=new YT.Player("yt",{videoId:i.vid,host:"https://www.youtube-nocookie.com",
    playerVars:{autoplay:auto?1:0,playsinline:1,rel:0,modestbranding:1},
    events:{onReady:()=>setVel(velEscolhida),onStateChange:e=>{if(e.data===1){if(!tocandoDesde)tocandoDesde=Date.now()}else if(tocandoDesde){assistiu+=(Date.now()-tocandoDesde)/1000*((player&&player.getPlaybackRate&&player.getPlaybackRate())||1);tocandoDesde=0}},onError:e=>{if([101,150,100].includes(e.data)){const v=document.querySelector(".video");if(v)v.innerHTML=`<div class="bloq">O dono deste vídeo não deixa ele tocar fora do YouTube.<div class="acoes" style="justify-content:center"><a class="pri" style="background:#fff;color:#000" href="${esc(i.url)}" target="_blank" rel="noopener">Abrir no YouTube</a></div></div>`}}}});
}

  const vt=e.target.closest(".voto");
  if(vt){const id=vt.dataset.id;lote=[];fica.add(id);
    if(vt.dataset.v==="sim"){if(seen.has(id)&&!naoSet.has(id)){ev("desfez",id);desmarca([id])}else{ev("dir",id);naoSet.delete(id);guardaNao();marca([id])}}
    else{if(naoSet.has(id)){ev("desfez",id);naoSet.delete(id);guardaNao();desmarca([id])}else{ev("esq",id);naoSet.add(id);guardaNao();marca([id])}}
    return}
  if(e.target.closest("#recolh")){verRecolhidos=!verRecolhidos;if(verRecolhidos)ev("rep_ver");render();return}
  const ex=e.target.closest(".extras .ex");if(ex){const i=DATA.itens.find(x=>x.id===ex.dataset.id);if(i){ev("rep_extra",i.id);abrir(i)}return}
  const sv=e.target.closest(".sav");
  if(sv){const id=sv.dataset.id,l=sv.dataset.l;if(tem(l,id))dessalvar(l,id);else{const i=DATA.itens.find(x=>x.id===id)||[...salvos.values()].find(o=>o.id===id);if(i)salvar(l,i)}return}
  const b=e.target.closest(".it");
  if(b){lote=[];const i=lista().find(x=>x.id===b.dataset.id)||DATA.itens.find(x=>x.id===b.dataset.id);if(i){if(verRecolhidos&&repSemNov(i))ev("rep_abriu",i.id);abrir(i)}}
});
$("end").addEventListener("click",e=>{
  if(e.target.id==="all"){lote=lista().map(i=>i.id).filter(id=>!seen.has(id));ev("todos",null,{n:lote.length,f:tema});marca(lote)}
  else if(e.target.id==="undo"){const l=lote;lote=[];desmarca(l)}
  else if(e.target.id==="unall"){desmarca(lista().map(i=>i.id))}
});
$("chips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ev("filtro",null,{k:modo==="pessoa"?"pessoa":"tema",v:b.dataset.t});limpaFica();tema=b.dataset.t;sub="Todos";lote=[];render();window.scrollTo({top:0,behavior:"smooth"})});
$("sub").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ev("filtro",null,{k:"canal",v:b.dataset.n});limpaFica();sub=b.dataset.n;lote=[];render();window.scrollTo({top:0,behavior:"smooth"})});
function trocaModo(m){limpaFica();ev("filtro",null,{k:"modo",v:m});const deLista=ehLista();modo=m;tema="Tudo";lote=[];if(deLista&&!ehLista()){fmt="novos";[...$("fmt").children].forEach(x=>x.setAttribute("aria-pressed",x.dataset.f==="novos"))}document.querySelectorAll("#modo button,#listas button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.m===m));render();window.scrollTo({top:0})}
$("modo").addEventListener("click",e=>{const b=e.target.closest("button");if(b)trocaModo(b.dataset.m)});
$("m-rel").addEventListener("click",async()=>{if(modo==="relatorio"){trocaModo("tema");return}ev("relatorio");trocaModo("relatorio");await carregaRel();if(modo==="relatorio")render()});
$("feed").addEventListener("click",e=>{const b=e.target.closest("#relper button");if(b){relPer=b.dataset.p;renderRel()}
  const d=e.target.closest(".dias-bar button");if(d){relDia=d.dataset.d;renderRel()}});
$("listas").addEventListener("click",e=>{const b=e.target.closest("button");if(b)trocaModo(modo===b.dataset.m?"tema":b.dataset.m)});
/* arrastar item para a direita: marca (ou desmarca) como visto */
let arrastou=false;
(()=>{let li=null,row=null,x0=0,y0=0,dx=0,horiz=null;
  const feed=$("feed");
  feed.addEventListener("pointerdown",e=>{const l=e.target.closest(".li");if(ehLista()||!l||e.target.closest(".sav,.voto"))return;li=l;row=l.querySelector(".row");x0=e.clientX;y0=e.clientY;dx=0;horiz=null});
  feed.addEventListener("pointermove",e=>{if(!li)return;const mx=e.clientX-x0,my=e.clientY-y0;
    if(horiz===null&&(Math.abs(mx)>8||Math.abs(my)>8))horiz=Math.abs(mx)>Math.abs(my)*1.2;
    if(!horiz)return;dx=mx;li.classList.toggle("esq",dx<0);row.classList.add("arrastando");row.style.transform=`translateX(${Math.max(-160,Math.min(dx,160))}px)`});
  const fim=()=>{if(!li)return;const l=li,r=row;li=null;r.classList.remove("arrastando");r.style.transform="";
    if(horiz&&Math.abs(dx)>8)arrastou=true;
    const id=l.dataset.id;
    if(horiz&&dx>90){lote=[];fica.delete(id);if(seen.has(id))ev("desfez",id);else ev("dir",id);setTimeout(()=>{seen.has(id)?desmarca([id]):marca([id])},150)}
    else if(horiz&&dx<-90){lote=[];fica.delete(id);ev("esq",id);naoSet.add(id);guardaNao();setTimeout(()=>{marca([id]);l.classList.remove("esq")},150)}
    else setTimeout(()=>l.classList.remove("esq"),200);
    setTimeout(()=>{arrastou=false},350)};
  feed.addEventListener("pointerup",fim);feed.addEventListener("pointercancel",fim);
})();
$("fmt").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ev("filtro",null,{k:"formato",v:b.dataset.f});limpaFica();fmt=b.dataset.f;lote=[];[...$("fmt").children].forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
$("sh-x").addEventListener("click",fechar);
$("scrim").addEventListener("click",fechar);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&abertoId)fechar()});
/* arrastar a folha para baixo fecha */
(()=>{let y0=null;const sh=$("sheet");
  sh.addEventListener("touchstart",e=>{if($("sh-corpo").scrollTop<=0)y0=e.touches[0].clientY},{passive:true});
  sh.addEventListener("touchmove",e=>{if(y0===null)return;const dy=e.touches[0].clientY-y0;if(dy>0)sh.style.transform=`translateY(${dy}px)`},{passive:true});
  sh.addEventListener("touchend",e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;sh.style.transform="";y0=null;if(dy>110)fechar()});
})();

/* dados */
function aviso(t){$("aviso").hidden=!t;$("aviso").textContent=t||""}
async function carregar(){
  try{
    const r=await fetch("radar.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await dec(r);
    const mudou=!DATA||d.atualizado!==DATA.atualizado;
    DATA=d;if(mudou)render();
    return d.atualizado;
  }catch(e){
    if(!DATA)$("feed").innerHTML=`<div class="msg"><strong>Não deu para carregar</strong>Confira a internet e tente de novo.<br><button onclick="carregar()">Tentar de novo</button></div>`;
    return null;
  }
}
let atualizando=false, pontos=null;
let nRes=0;setInterval(()=>{nRes=(nRes+1)%4;document.querySelectorAll(".pts").forEach(e=>e.textContent=".".repeat(nRes))},500);
$("ref").addEventListener("click",async()=>{
  if(atualizando)return;
  atualizando=true;$("ref").classList.add("girando");limpaFica();render();
  const antes=DATA&&DATA.atualizado;
  try{
    await fetch("https://ntfy.sh/"+TOPICO,{method:"POST",body:"atualizar"});
    let n=0;aviso("Atualizando");pontos=setInterval(()=>{n=(n+1)%4;aviso("Atualizando"+".".repeat(n))},500);
    const ini=Date.now();
    while(Date.now()-ini<7*60000){
      await new Promise(r=>setTimeout(r,15000));
      const a=await carregar();
      if(a&&a!==antes){clearInterval(pontos);aviso("Radar RSM atualizado.");setTimeout(()=>aviso(""),4000);return}
    }
    clearInterval(pontos);aviso("O Mac não respondeu. Ele pode estar desligado ou dormindo.");
  }catch(e){clearInterval(pontos);aviso("Sem internet para enviar o pedido.")}
  finally{clearInterval(pontos);atualizando=false;$("ref").classList.remove("girando")}
});
let ultimaCarga=Date.now();
let sessIni=Date.now();ev("app");
document.addEventListener("visibilitychange",()=>{if(document.hidden){saiuEm=Date.now();ev("sai",null,{s:Math.round((Date.now()-sessIni)/1000)});if(abertoId)registraFecho();enviaEv();return}
  sessIni=Date.now();ev("app");confereVersao();carregaIndice();if(saiuEm&&Date.now()-saiuEm>10*60000){limpaFica();render()}vigiaFila();sincroniza();if(Date.now()-ultimaCarga>3*60000){ultimaCarga=Date.now();carregar()}});
confereVersao();carregar().then(sincroniza);carregaIndice();carregaEstudo();vigiaFila();
setInterval(()=>{if(!document.hidden){carregaIndice();carregaEstudo()}},90000);
</script>
